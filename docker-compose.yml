name: agent-company

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agent-company-frontend:latest
    container_name: agent-company-frontend
    ports:
      - "127.0.0.1:8790:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

