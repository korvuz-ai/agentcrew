# Nginx config for crew.korvuz.sit
# Place at: /etc/nginx/sites-available/crew.korvuz.sit
# Enable: ln -s /etc/nginx/sites-available/crew.korvuz.sit /etc/nginx/sites-enabled/
# SSL:  certbot --nginx -d crew.korvuz.sit

server {
    listen 80;
    server_name crew.korvuz.sit;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crew.korvuz.sit;

    ssl_certificate     /etc/letsencrypt/live/crew.korvuz.sit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crew.korvuz.sit/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Frontend (Next.js on 8790) ──────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8790;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Backend REST API (FastAPI on 8791) ──────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8791/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket (FastAPI /ws/* on 8791) ───────────────────────────────────
    location /ws/ {
        proxy_pass             http://127.0.0.1:8791/ws/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
